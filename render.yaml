# Render Blueprint: provisions the backend Web Service + PostgreSQL.
# Apply via "New +" -> "Blueprint" in the Render dashboard, pointing at this repo.
services:
  - type: web
    name: release-checklist-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: release-checklist-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false # set to the Vercel frontend URL after deploying the frontend

databases:
  - name: release-checklist-db
    databaseName: releases
    user: releases
